<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow transparent brand assets</title><style>body{font:16px system-ui;margin:32px;background:#e9edf3;color:#142033}main{max-width:900px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{padding:36px 28px;border-radius:16px;background:white}.dark{background:#111827;color:#f1f5f9}.dark img{filter:brightness(1.8)}.logo{width:100%;height:90px;object-fit:contain}.icon{width:80px;height:80px;margin:24px 20px 0 0}.small{width:32px;height:32px}.tiny{width:16px;height:16px}h2{font-size:17px}a{color:#2563eb}</style><main><h1>TaskFlow</h1><p>Transparent SVG wordmark and symbol, shown on both backgrounds.</p><div class="cards"><section class="card"><h2>Light background</h2><img class="logo" src="/taskflow-logo.svg" alt="TaskFlow"><img class="icon" src="/taskflow-icon.svg" alt="TaskFlow symbol"><img class="small" src="/demo-projects/taskflow-favicon-32.png" alt="32 pixel favicon"><img class="tiny" src="/demo-projects/taskflow-favicon-16.png" alt="16 pixel favicon"></section><section class="card dark"><h2>Dark background</h2><img class="logo" src="/taskflow-logo.svg" alt="TaskFlow"><img class="icon" src="/taskflow-icon.svg" alt="TaskFlow symbol"><img class="small" src="/demo-projects/taskflow-favicon-32.png" alt="32 pixel favicon"><img class="tiny" src="/demo-projects/taskflow-favicon-16.png" alt="16 pixel favicon"></section></div></main></html>
